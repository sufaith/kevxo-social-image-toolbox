server {
    listen 80;
    listen [::]:80;
    server_name kevxo.com www.kevxo.com;
    return 301 https://kevxo.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kevxo.com;

    ssl_certificate /www/server/panel/vhost/cert/kevxo.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/kevxo.com/privkey.pem;
    return 301 https://kevxo.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kevxo.com;

    root /www/wwwroot/kevxo.com/current;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/kevxo.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/kevxo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;

    location /_next/static/ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|ico|svg|woff2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.(?:html|xml|txt|webmanifest)$ {
        try_files $uri $uri/ $uri/index.html =404;
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    access_log /www/wwwlogs/kevxo.com.log;
    error_log /www/wwwlogs/kevxo.com.error.log;
}
